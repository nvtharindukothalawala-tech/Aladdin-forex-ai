services:

  aladdin-api:

    build: .

    container_name: aladdin-forex-ai-prod


    ports:
      - "8000:8000"


    env_file:
      - .env.production.example


    depends_on:
      postgres:
        condition: service_healthy


    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 30s

      timeout: 10s

      retries: 3



  postgres:

    image: postgres:16


    container_name: aladdin-postgres-prod


    environment:

      POSTGRES_DB: aladdin_db

      POSTGRES_USER: aladdin_user

      POSTGRES_PASSWORD: aladdin_password


    ports:

      - "5432:5432"


    volumes:

      - postgres_prod_data:/var/lib/postgresql/data


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U aladdin_user -d aladdin_db"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



volumes:

  postgres_prod_data: