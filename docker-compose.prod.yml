services:

  aladdin-api:

    build: .

    container_name: aladdin-forex-ai-prod

    ports:
      - "8000:8000"

    env_file:
      - .env.production

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:

    image: postgres:16

    container_name: aladdin-postgres-prod

    environment:

      POSTGRES_DB: aladdin_db

      POSTGRES_USER: aladdin_user

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aladdin_user -d aladdin_db"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:

  postgres_prod_data: