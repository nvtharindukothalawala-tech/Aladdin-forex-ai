services:

  aladdin-api:

    build: .

    container_name: aladdin-forex-ai


    ports:
      - "8000:8000"


    env_file:
      - .env


    volumes:
      - ./data:/app/data


    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]

      interval: 30s

      timeout: 10s

      retries: 3