name: Aladdin CI Pipeline

on:
  push:
    branches:
      - main
      - phase-6-production-readiness

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    env:
      ALADDIN_MT5_MODE: MOCK
      ALADDIN_ENABLE_DEMO_EXECUTION: "false"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Run tests
        run: |
          python -m pytest -v


  docker-build:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build -t aladdin-forex-ai .